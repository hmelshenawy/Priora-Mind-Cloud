[project]
name = "agentcore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haitham Elshenawy", email = "hm.elshenawy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tzdata>=2026.4",
    "uvicorn>=0.53.0",
]

[project.scripts]
agent-service = "agentcore:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
